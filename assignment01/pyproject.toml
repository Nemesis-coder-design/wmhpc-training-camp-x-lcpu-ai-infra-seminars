[project]
name = "assignment01"
version = "0.1.0"
description = "Session 1 作业：GPU & GPU Programming"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "triton>=3.0",
    "pytest>=8.0",
    "numpy",
]

[project.optional-dependencies]
# TileLang 题（7.3～7.7、Bonus）用；README 的安装命令已带上此 extra
tilelang = ["tilelang==0.1.12"]

[tool.uv]
package = false

# PyTorch CUDA 12.4 源 — 兼容本机 CUDA 12.9 驱动
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
